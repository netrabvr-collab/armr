<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMR Car Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#msg {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  border-radius: 8px;
  font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<div id="msg">
  Point camera at target image
</div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="car"
      src="./models/ARMR_Assign1.glb">
    </a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-light type="ambient" intensity="1.5"></a-light>
  <a-light type="directional" intensity="2" position="1 2 3"></a-light>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Reference Cube -->
    <a-box
      color="blue"
      position="0 0 0"
      scale="0.2 0.2 0.2">
    </a-box>

    <!-- Car -->
    <a-gltf-model
      src="#car"
      position="0 0 0"
      rotation="0 0 0"
      scale="1 1 1">
    </a-gltf-model>

  </a-entity>

</a-scene>

</body>
</html>
