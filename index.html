<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 10px;
  font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<div id="status">Loading...</div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="car"
      src="./models/ARMR_Assign1.glb">
    </a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="3" position="1 2 3"></a-light>

  <a-entity mindar-image-target="targetIndex: 0">

    
    <!-- GLB Model -->
    <a-entity
      id="carModel"
      gltf-model="#car"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.05 0.05 0.05">
    </a-entity>

  </a-entity>

</a-scene>

<script>
window.addEventListener("load", () => {

  const model = document.getElementById("carModel");
  const status = document.getElementById("status");

  model.addEventListener("model-loaded", () => {

    status.innerHTML = "GLB LOADED";

    const mesh = model.getObject3D("mesh");

    if (mesh) {

      const box = new THREE.Box3().setFromObject(mesh);
      const center = box.getCenter(new THREE.Vector3());

      mesh.position.x -= center.x;
      mesh.position.y -= center.y;
      mesh.position.z -= center.z;

      console.log("Model centered");
    }

  });

  model.addEventListener("model-error", (e) => {

    status.innerHTML = "GLB ERROR";
    console.error(e);

  });

});
</script>

</body>
</html>
