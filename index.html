<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body { margin: 0; overflow: hidden; }
#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  background: rgba(0,0,0,.7);
  color: white;
  padding: 10px;
}
</style>
</head>

<body>

<div id="status">Loading...</div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="car"
      src="./models/ARMR_Assign1.glb">
    </a-asset-item>
  </a-assets>

  <a-camera position="0 0 0"></a-camera>

  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="3" position="1 2 3"></a-light>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-box
      color="red"
      position="0 0 0"
      scale="0.2 0.2 0.2">
    </a-box>

    <a-entity
      id="carModel"
      gltf-model="#car"
      position="0 0 0"
      scale="10 10 10">
    </a-entity>

  </a-entity>

</a-scene>

<script>
const model = document.getElementById('carModel');
const status = document.getElementById('status');

model.addEventListener('model-loaded', () => {
  status.innerHTML = 'GLB LOADED';
  console.log('MODEL LOADED');
});

model.addEventListener('model-error', (e) => {
  status.innerHTML = 'GLB ERROR';
  console.error(e);
});
</script>

</body>
</html>
