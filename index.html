<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMR Assignment 1</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#status {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 8px;
  border-radius: 8px;
  font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<div id="status">
  Point camera at target image
</div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="car"
      src="./models/ARMR_Assign1.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-light
    type="ambient"
    intensity="1">
  </a-light>

  <a-light
    type="directional"
    intensity="1"
    position="1 2 3">
  </a-light>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- DEBUG BOX -->
    <a-box
      color="red"
      position="0 0 0"
      scale="0.2 0.2 0.2">
    </a-box>

    <!-- CAR MODEL -->
    <a-gltf-model
      src="#car"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.01 0.01 0.01">
    </a-gltf-model>

  </a-entity>

</a-scene>

</body>
</html>
